name: Feature Request
description: Suggest an idea or improvement for the Fake GPU Operator
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this Fake GPU Operator feature-request form!

        > **This is a public repository.** Do not include customer names, internal hostnames,
        > credentials, or other confidential data. If your report contains confidential information,
        > contact the maintainers privately instead of opening a public issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: |
        What are you trying to do, and why is it hard or impossible today? Describe the use case
        rather than the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: |
        A clear and concise description of what you want to add or change in the Fake GPU Operator.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they're less ideal.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected component(s)
      multiple: true
      options:
        - device-plugin
        - dra-plugin
        - topology-server
        - status-updater
        - status-exporter
        - kwok
        - compute-domain
        - mig-faker
        - nvidia-smi
        - chart (Helm)
        - ci
        - docs
        - other
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, or anything else that helps.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the [existing issues](https://github.com/run-ai/fake-gpu-operator/issues) and this feature has not been requested yet.
          required: true
        - label: I'm willing to submit a pull request for this feature.
          required: false
  - type: markdown
    attributes:
      value: Love this feature? Give it a 👍 below.
